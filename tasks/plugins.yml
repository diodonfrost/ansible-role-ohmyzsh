---
- name: Plugins | Set ohmyzsh plugins to use
  ansible.builtin.lineinfile:
    path: "{{ item['home'] }}/.zshrc"
    regexp: '^plugins='
    line: 'plugins=({{ ohmyzsh_plugins | join(" ") }})'
    owner: "{{ item['name'] }}"
    group: "{{ item['group'] }}"
  loop: "{{ ohmyzsh_users_information }}"
